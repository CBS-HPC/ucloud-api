[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ucloud-workflow"
version = "0.1.3"
description = "Python uv project for UCloud job automation and delivery packaging"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
keywords = ["ucloud", "hpc", "workflow", "job automation", "delivery packaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
ucloud = "ucloud_workflow.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ucloud_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
